name: Apply verified G1 lock candidate

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: feature/g1-reproducible-dependencies
          fetch-depth: 2

      - name: Verify applicator ancestry
        run: |
          set -Eeuo pipefail
          expected_parent='ddbaa92e585d9ced18acdfed08ee586638442627'
          actual_parent="$(git rev-parse HEAD^)"
          test "$actual_parent" = "$expected_parent"
          changed="$(git diff --name-only "$expected_parent"..HEAD)"
          test "$changed" = '.github/workflows/apply-g1-lock-candidate.yml'

      - name: Download exact lock candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: control-plane-lock-candidate-d0ae5e4ed1d22d60cbe893e6cdd480835f97aa69
          path: candidate
          github-token: ${{ github.token }}
          repository: m9117882424/ai_orchestra
          run-id: '33888419214'

      - name: Verify exact candidate and apply atomically
        run: |
          set -Eeuo pipefail

          test "$(sha256sum candidate/requirements.lock | awk '{print $1}')" = '294a61a1139b8764eff5f99c07d23396d31971e392002eaf002410520cdd4074'
          test "$(sha256sum candidate/requirements-dev.lock | awk '{print $1}')" = '9d4a7b3df35d7479a960f4fb8e35f35ff72deaf64ae259da3933292edfeddc4c'
          test "$(sha256sum candidate/dependency-locks.sha256 | awk '{print $1}')" = '5dfcf40fdd17d9d4c161d66fe8e3a48ecfc8f80ad7748d392760b23c45ac9144'

          install -m 0644 candidate/requirements.lock control_plane/requirements.lock
          install -m 0644 candidate/requirements-dev.lock control_plane/requirements-dev.lock
          install -m 0644 candidate/dependency-locks.sha256 control_plane/dependency-locks.sha256

          (cd control_plane && sha256sum -c dependency-locks.sha256)
          python scripts/verify_dependency_locks.py

          git rm .github/workflows/apply-g1-lock-candidate.yml
          git add control_plane/requirements.lock control_plane/requirements-dev.lock control_plane/dependency-locks.sha256

          unexpected="$(git diff --cached --name-only | grep -Ev '^(control_plane/requirements\.lock|control_plane/requirements-dev\.lock|control_plane/dependency-locks\.sha256|\.github/workflows/apply-g1-lock-candidate\.yml)$' || true)"
          test -z "$unexpected"

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'build: adopt Python 3.12.14 dependency lock candidate'
          git push origin HEAD:feature/g1-reproducible-dependencies
