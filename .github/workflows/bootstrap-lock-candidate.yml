name: Bootstrap verified dependency lock artifact

on:
  push:
    branches:
      - feature/g1-reproducible-dependencies
    paths:
      - .github/workflows/bootstrap-lock-candidate.yml

permissions:
  contents: write
  actions: read

jobs:
  commit-lock-artifact:
    runs-on: ubuntu-24.04
    steps:
      - name: Verify exact CI artifact and commit atomically
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          GH_SHA: ${{ github.sha }}
          GH_BRANCH: ${{ github.ref_name }}
          ARTIFACT_ID: "9938879416"
          ARTIFACT_SHA256: "43a3f0384315d7a19de666be13d5ad40b3410309a38898dd99074ee43b074c08"
        run: |
          python3 - <<'PY'
          import base64
          import hashlib
          import io
          import json
          import os
          import urllib.parse
          import urllib.request
          import zipfile

          token = os.environ["GH_TOKEN"]
          repo = os.environ["GH_REPOSITORY"]
          trigger_sha = os.environ["GH_SHA"]
          branch = os.environ["GH_BRANCH"]
          artifact_id = os.environ["ARTIFACT_ID"]
          expected_zip_sha256 = os.environ["ARTIFACT_SHA256"]
          api_root = f"https://api.github.com/repos/{repo}"

          def request(method, url, body=None):
              data = None if body is None else json.dumps(body).encode("utf-8")
              req = urllib.request.Request(url, data=data, method=method)
              req.add_header("Authorization", f"Bearer {token}")
              req.add_header("Accept", "application/vnd.github+json")
              req.add_header("X-GitHub-Api-Version", "2022-11-28")
              if data is not None:
                  req.add_header("Content-Type", "application/json")
              with urllib.request.urlopen(req, timeout=60) as response:
                  payload = response.read()
                  ctype = response.headers.get("Content-Type", "")
                  if "json" in ctype:
                      return json.loads(payload.decode("utf-8"))
                  return payload

          artifact = request("GET", f"{api_root}/actions/artifacts/{artifact_id}/zip")
          actual_zip_sha256 = hashlib.sha256(artifact).hexdigest()
          assert actual_zip_sha256 == expected_zip_sha256, (
              f"Artifact digest mismatch: {actual_zip_sha256} != {expected_zip_sha256}"
          )

          with zipfile.ZipFile(io.BytesIO(artifact)) as archive:
              names = set(archive.namelist())
              expected_names = {
                  "requirements.lock",
                  "requirements-dev.lock",
                  "dependency-locks.sha256",
              }
              assert names == expected_names, f"Unexpected artifact members: {sorted(names)}"
              candidate = {name: archive.read(name) for name in expected_names}

          manifest = {}
          for raw_line in candidate["dependency-locks.sha256"].decode("utf-8").splitlines():
              digest, filename = raw_line.split(maxsplit=1)
              manifest[filename] = digest

          for lock_name in ("requirements.lock", "requirements-dev.lock"):
              actual = hashlib.sha256(candidate[lock_name]).hexdigest()
              assert manifest.get(lock_name) == actual, f"Manifest mismatch for {lock_name}"
              text = candidate[lock_name].decode("utf-8")
              assert text.startswith("# AI Orchestra deterministic dependency lock\n")
              for line in text.splitlines():
                  if line.lstrip().startswith("#"):
                      continue
                  lowered = line.lstrip().lower()
                  assert not lowered.startswith(("--no-index", "--index-url", "--extra-index-url", "--trusted-host", "--find-links")), line

          def fetch_repo_file(path):
              encoded = urllib.parse.quote(path, safe="/")
              ref = urllib.parse.quote(trigger_sha, safe="")
              payload = request("GET", f"{api_root}/contents/{encoded}?ref={ref}")
              return base64.b64decode(payload["content"])

          for input_name in ("requirements.in", "requirements-dev.in"):
              source = fetch_repo_file(f"control_plane/{input_name}")
              actual = hashlib.sha256(source).hexdigest()
              assert manifest.get(input_name) == actual, (
                  f"Artifact was generated from different {input_name}: {manifest.get(input_name)} != {actual}"
              )

          ref = request("GET", f"{api_root}/git/ref/heads/{branch}")
          current_sha = ref["object"]["sha"]
          assert current_sha == trigger_sha, (
              f"Branch moved during verification: {current_sha} != {trigger_sha}"
          )
          current_commit = request("GET", f"{api_root}/git/commits/{current_sha}")
          base_tree = current_commit["tree"]["sha"]

          repo_paths = {
              "control_plane/requirements.lock": "requirements.lock",
              "control_plane/requirements-dev.lock": "requirements-dev.lock",
              "control_plane/dependency-locks.sha256": "dependency-locks.sha256",
          }
          tree_entries = []
          for repo_path, artifact_name in repo_paths.items():
              blob = request("POST", f"{api_root}/git/blobs", {
                  "content": candidate[artifact_name].decode("utf-8"),
                  "encoding": "utf-8",
              })
              tree_entries.append({
                  "path": repo_path,
                  "mode": "100644",
                  "type": "blob",
                  "sha": blob["sha"],
              })

          new_tree = request("POST", f"{api_root}/git/trees", {
              "base_tree": base_tree,
              "tree": tree_entries,
          })
          new_commit = request("POST", f"{api_root}/git/commits", {
              "message": "Commit exact verified dependency lock artifact",
              "tree": new_tree["sha"],
              "parents": [current_sha],
          })
          request("PATCH", f"{api_root}/git/refs/heads/{branch}", {
              "sha": new_commit["sha"],
              "force": False,
          })
          print(f"Committed verified artifact as {new_commit['sha']}")
          PY
