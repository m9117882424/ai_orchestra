name: Проверка конфигурации

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Получить код
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Подготовить инструменты проверки
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          python3 -m pip install 'pyyaml==6.0.3'

      - name: Подготовить безопасную тестовую конфигурацию
        run: |
          cp .env.example .env
          cp .env.providers.example .env.providers
          cp .env.repositories.example .env.repositories
          chmod 600 .env .env.providers .env.repositories
          cp config/opencode.gateway.json runtime/opencode.json
          cp config/model-router.shared.yaml runtime/model-router.yaml

      - name: Проверить JSON, YAML, Python и JavaScript
        run: |
          python3 -m json.tool config/opencode.gateway.json >/dev/null
          python3 -m json.tool runtime/opencode.json >/dev/null
          python3 - <<'PY'
          from pathlib import Path
          import yaml
          for path in [Path('config/model-router.shared.yaml'), Path('config/model-router.separate.yaml')]:
              data = yaml.safe_load(path.read_text(encoding='utf-8'))
              assert isinstance(data, dict) and isinstance(data.get('model_list'), list) and data['model_list'], path
          print('[OK] router YAML parsed')
          PY
          python3 -m compileall -q control_plane/app control_plane/migrations control_plane/tests scripts/model_router_smoke.py scripts/static_security_check.py scripts/verify_dependency_locks.py scripts/temporal_durable_poc.py
          node --check control_plane/app/static/app.js

      - name: Проверить shell-скрипты
        run: |
          bash -n scripts/bootstrap.sh
          bash -n scripts/switch-key-mode.sh
          bash -n scripts/preflight.sh
          bash -n scripts/smoke.sh
          bash -n scripts/backup.sh
          bash -n scripts/worktree-create.sh
          bash -n scripts/worktree-remove.sh
          bash -n scripts/migrate-control-plane.sh
          bash -n scripts/postgres-schema-smoke.sh
          bash -n scripts/verify-backup.sh
          bash -n scripts/restore-drill.sh
          bash -n scripts/export-backup-offsite.sh
          bash -n scripts/backup-restore-smoke.sh
          bash -n scripts/temporal-durable-smoke.sh
          bash -n control_plane/app/repo_manager_git_wrapper.sh
          bash -n control_plane/app/workspace_volume_init.sh
          shellcheck scripts/*.sh
          shellcheck control_plane/app/repo_manager_git_wrapper.sh
          shellcheck control_plane/app/workspace_volume_init.sh

      - name: Проверить dependency locks
        run: |
          python3 scripts/verify_dependency_locks.py
          python3 -m pip install --dry-run --require-hashes --requirement control_plane/requirements.lock
          python3 -m pip install --dry-run --require-hashes --requirement control_plane/requirements-dev.lock

      - name: Проверить Temporal PoC dependency lock
        run: |
          (cd poc/temporal && sha256sum --check dependency-lock.sha256)
          python3 -m pip install --dry-run --require-hashes --requirement poc/temporal/requirements.lock

      - name: Проверить Docker Compose и границы безопасности
        run: |
          docker compose config --quiet
          python3 scripts/static_security_check.py

      - name: Установить зависимости кабинета из dev lock
        run: python3 -m pip install --require-hashes --requirement control_plane/requirements-dev.lock

      - name: Проверить API и migration safety
        run: python3 -m pytest control_plane/tests

      - name: Проверить Docker buildability with current upstream bases
        run: docker compose build --pull

      - name: Проверить Temporal durable-workflow PoC
        run: bash ./scripts/temporal-durable-smoke.sh

      - name: Проверить backup/restore disaster-recovery path
        run: bash ./scripts/backup-restore-smoke.sh

      - name: Проверить PostgreSQL migration semantics
        run: bash ./scripts/postgres-schema-smoke.sh

      - name: Проверить базовый OpenCode toolchain
        run: |
          docker compose run --rm -T --no-deps --entrypoint sh opencode -lc '
            command -v git >/dev/null &&
            command -v rg >/dev/null &&
            command -v jq >/dev/null &&
            command -v python3 >/dev/null &&
            command -v node >/dev/null &&
            rg --version | head -n 1
          '

      - name: Проверить isolated Git worker toolchains and workspace ownership
        run: |
          echo "[CHECK] Control Plane has no Git toolchain"
          docker compose run --rm -T --no-deps control-plane sh -lc '
            ! command -v git
          '
          echo "[OK] Control Plane has no Git toolchain"
          echo "[CHECK] Repo Manager non-root Git wrapper"
          docker compose run --rm -T --no-deps repo-manager sh -lc '
            test "$(id -u)" != 0 &&
            test -x /app/app/repo_manager_askpass.py &&
            test -x /app/app/repo_manager_git_wrapper.sh &&
            REPO_MANAGER_GIT_MAX_FILE_BLOCKS=2048 /app/app/repo_manager_git_wrapper.sh --version
          '
          echo "[OK] Repo Manager non-root Git wrapper"
          echo "[CHECK] Task workspace volume initialization"
          docker compose run --rm -T --no-deps workspace-volume-init
          echo "[OK] Task workspace volume initialization"
          echo "[CHECK] Workspace Manager write access"
          docker compose run --rm -T --no-deps workspace-manager sh -lc '
            test "$(id -u)" = 10001 &&
            command -v git >/dev/null &&
            printf "workspace-manager\n" > /workspace/worktrees/managed/.ci-workspace-boundary &&
            chmod 0600 /workspace/worktrees/managed/.ci-workspace-boundary
          '
          echo "[OK] Workspace Manager write access"
          echo "[CHECK] OpenCode write access to the same named volume"
          docker compose run --rm -T --no-deps --entrypoint sh opencode -lc '
            test "$(id -u)" = 0 &&
            test -f /workspace/worktrees/managed/.ci-workspace-boundary &&
            printf "opencode-write\n" >> /workspace/worktrees/managed/.ci-workspace-boundary &&
            grep -Fxq opencode-write /workspace/worktrees/managed/.ci-workspace-boundary &&
            chmod 0640 /workspace/worktrees/managed/.ci-workspace-boundary &&
            test "$(stat -c %a /workspace/worktrees/managed/.ci-workspace-boundary)" = 640
          '
          echo "[OK] OpenCode write access to the same named volume"
          echo "[CHECK] Execution Worker read-only access"
          docker compose run --rm -T --no-deps execution-worker sh -lc '
            test "$(id -u)" = 10001 &&
            command -v git >/dev/null &&
            test -f /workspace/worktrees/managed/.ci-workspace-boundary &&
            grep -Fxq opencode-write /workspace/worktrees/managed/.ci-workspace-boundary &&
            if sh -c "printf forbidden >> /workspace/worktrees/managed/.ci-workspace-boundary" 2>/dev/null; then
              echo "[FAIL] Execution Worker unexpectedly wrote to task workspace" >&2
              exit 1
            fi
          '
          echo "[OK] Execution Worker read-only access"
          echo "[CHECK] Workspace Manager cleanup access"
          docker compose run --rm -T --no-deps workspace-manager sh -lc '
            rm /workspace/worktrees/managed/.ci-workspace-boundary
          '
          echo "[OK] Workspace Manager cleanup access"
