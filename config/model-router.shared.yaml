model_list:
  - model_name: orchestra-lead
    litellm_params:
      model: openai/claude-sonnet-4-5
      api_base: os.environ/AITUNNEL_BASE_URL
      api_key: os.environ/AITUNNEL_API_KEY
  - model_name: orchestra-reviewer
    litellm_params:
      model: openai/claude-sonnet-4-5
      api_base: os.environ/AITUNNEL_BASE_URL
      api_key: os.environ/AITUNNEL_API_KEY
  - model_name: orchestra-risk
    litellm_params:
      model: openai/claude-sonnet-4-5
      api_base: os.environ/AITUNNEL_BASE_URL
      api_key: os.environ/AITUNNEL_API_KEY
  - model_name: orchestra-architect
    litellm_params:
      model: openai/gpt-5.2-pro
      api_base: os.environ/AITUNNEL_BASE_URL
      api_key: os.environ/AITUNNEL_API_KEY
  - model_name: orchestra-coder
    litellm_params:
      model: openai/gpt-5.1-codex-max
