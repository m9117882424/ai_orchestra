      model: openai/qwen/qwen3-coder
      api_base: os.environ/AITUNNEL_BASE_URL
      api_key: os.environ/AITUNNEL_API_KEY

general_settings:
  master_key: os.environ/MODEL_ROUTER_MASTER_KEY

litellm_settings:
  drop_params: true
  request_timeout: 180
