name: ai-development-department

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ai_orchestra
      POSTGRES_USER: ai_orchestra
      POSTGRES_PASSWORD: ${CONTROL_PLANE_DB_PASSWORD}
    volumes:
      - control-plane-postgres:/var/lib/postgresql/data
    networks:
      - control-db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai_orchestra -d ai_orchestra"]
      interval: 10s
      timeout: 5s
      retries: 10
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    cpus: 0.75
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: "5"

  control-plane:
    build:
      context: ./control_plane
    image: ai-development-department/control-plane:0.3.0
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    environment:
      CONTROL_PLANE_ENVIRONMENT: production
      CONTROL_PLANE_DB_HOST: postgres
      CONTROL_PLANE_DB_PORT: 5432
      CONTROL_PLANE_DB_NAME: ai_orchestra
      CONTROL_PLANE_DB_USER: ai_orchestra
      CONTROL_PLANE_DB_PASSWORD: ${CONTROL_PLANE_DB_PASSWORD}
      CONTROL_PLANE_SERVER_USERNAME: ${CONTROL_PLANE_SERVER_USERNAME}
      CONTROL_PLANE_SERVER_PASSWORD: ${CONTROL_PLANE_SERVER_PASSWORD}
      CONTROL_PLANE_OPENCODE_URL: ${OPENCODE_PUBLIC_URL:-http://127.0.0.1:4096}
      CONTROL_PLANE_DEFAULT_MONTHLY_BUDGET: ${CONTROL_PLANE_DEFAULT_MONTHLY_BUDGET:-25000}
    ports:
      - "127.0.0.1:${CONTROL_PLANE_PORT:-8088}:8080"
    networks:
      - control-db
    depends_on:
      postgres:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 384m
    cpus: 0.50
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: "5"

  model-router:
    build:
      context: ./model_router
      args:
        LITELLM_VERSION: ${LITELLM_VERSION:-1.99.0}
    image: ai-development-department/model-router:${LITELLM_VERSION:-1.99.0}
    restart: unless-stopped
    init: true
    env_file:
      - .env.providers
    environment:
      MODEL_ROUTER_MASTER_KEY: ${MODEL_ROUTER_MASTER_KEY}
    volumes:
      - ./runtime/model-router.yaml:/app/config.yaml:ro
    networks:
      - router-backend
      - provider-egress
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 768m
    cpus: 1.00
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4000/health/liveliness', timeout=3)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: "5"

  model-gateway:
    build:
      context: ./model_gateway
    image: ai-development-department/model-gateway:0.1.0
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /etc/nginx/conf.d:size=1m,mode=1777
      - /var/cache/nginx:size=16m,mode=1777
      - /var/run:size=4m,mode=1777
    environment:
      MODEL_ROUTER_MASTER_KEY: ${MODEL_ROUTER_MASTER_KEY}
      MODEL_ROUTER_CLIENT_KEY: ${MODEL_ROUTER_CLIENT_KEY}
    ports:
      - "127.0.0.1:${MODEL_GATEWAY_PORT:-18089}:8080"
    networks:
      - model-net
      - router-backend
    depends_on:
      model-router:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - NET_RAW
    mem_limit: 64m
    cpus: 0.25
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  opencode:
    build:
      context: .
      args:
        OPENCODE_VERSION: ${OPENCODE_VERSION:-1.18.27}
    image: ai-development-department/opencode:${OPENCODE_VERSION:-1.18.27}
    restart: unless-stopped
    init: true
    environment:
      OPENCODE_CONFIG: /root/.config/opencode/opencode.json
      OPENCODE_SERVER_USERNAME: ${OPENCODE_SERVER_USERNAME}
      OPENCODE_SERVER_PASSWORD: ${OPENCODE_SERVER_PASSWORD}
      MODEL_ROUTER_CLIENT_KEY: ${MODEL_ROUTER_CLIENT_KEY}
      GIT_AUTHOR_NAME: ${GIT_AUTHOR_NAME:-AI Development Department}
      GIT_AUTHOR_EMAIL: ${GIT_AUTHOR_EMAIL:-ai-department@local}
      GIT_COMMITTER_NAME: ${GIT_COMMITTER_NAME:-AI Development Department}
      GIT_COMMITTER_EMAIL: ${GIT_COMMITTER_EMAIL:-ai-department@local}
    command:
      - opencode
      - web
      - --hostname
      - 0.0.0.0
      - --port
      - "4096"
    ports:
      - "127.0.0.1:${OPENCODE_PORT:-4096}:4096"
    networks:
      - model-net
    volumes:
      - ./runtime/opencode.json:/root/.config/opencode/opencode.json:ro
      - ./prompts:/root/.config/opencode/prompts:ro
      - ./policy/AGENTS.md:/workspace/repos/AGENTS.md:ro
      - ./policy/AGENTS.md:/workspace/worktrees/AGENTS.md:ro
      - ./repos:/workspace/repos/projects
      - ./worktrees:/workspace/worktrees
      - ./data/opencode:/root/.local/share/opencode
      - ./data/state:/root/.local/state/opencode
    depends_on:
      model-gateway:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 2g
    cpus: 2.00
    healthcheck:
      test:
        - CMD-SHELL
        - "curl -fsS -u \"$${OPENCODE_SERVER_USERNAME}:$${OPENCODE_SERVER_PASSWORD}\" http://127.0.0.1:4096/global/health >/dev/null || exit 1"
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: "5"

networks:
  control-db:
    internal: true
  model-net:
  router-backend:
    internal: true
  provider-egress:

volumes:
  control-plane-postgres:
