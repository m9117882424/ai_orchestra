name: ai-development-department

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ai_orchestra
      POSTGRES_USER: ai_orchestra
      POSTGRES_PASSWORD: ${CONTROL_PLANE_DB_PASSWORD}
    volumes:
      - control-plane-postgres:/var/lib/postgresql/data
    networks:
      - control-db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai_orchestra -d ai_orchestra"]
      interval: 10s
      timeout: 5s
      retries: 10
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    cpus: 0.75
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: "5"

  control-plane:
    build:
      context: ./control_plane
      target: control-plane
    image: ai-development-department/control-plane:0.9.0
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    environment:
      CONTROL_PLANE_ENVIRONMENT: production
      CONTROL_PLANE_DB_HOST: postgres
      CONTROL_PLANE_DB_PORT: 5432
      CONTROL_PLANE_DB_NAME: ai_orchestra
      CONTROL_PLANE_DB_USER: ai_orchestra
      CONTROL_PLANE_DB_PASSWORD: ${CONTROL_PLANE_DB_PASSWORD}
      CONTROL_PLANE_SERVER_USERNAME: ${CONTROL_PLANE_SERVER_USERNAME}
      CONTROL_PLANE_SERVER_PASSWORD: ${CONTROL_PLANE_SERVER_PASSWORD}
      CONTROL_PLANE_OPENCODE_URL: ${OPENCODE_PUBLIC_URL:-http://127.0.0.1:4096}
      CONTROL_PLANE_OPENCODE_INTERNAL_URL: http://opencode:4096
      CONTROL_PLANE_OPENCODE_USERNAME: ${OPENCODE_SERVER_USERNAME}
      CONTROL_PLANE_OPENCODE_PASSWORD: ${OPENCODE_SERVER_PASSWORD}
      CONTROL_PLANE_EXECUTION_TIMEOUT_SECONDS: ${CONTROL_PLANE_EXECUTION_TIMEOUT_SECONDS:-7200}
      CONTROL_PLANE_DEFAULT_MONTHLY_BUDGET: ${CONTROL_PLANE_DEFAULT_MONTHLY_BUDGET:-25000}
    ports:
      - "127.0.0.1:${CONTROL_PLANE_PORT:-8088}:8080"
    networks:
      - control-db
      - control-access
      - model-net
    depends_on:
      postgres:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 384m
    cpus: 0.50
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: "5"

  execution-worker:
    build:
      context: ./control_plane
      target: execution-worker
    image: ai-development-department/execution-worker:0.9.0
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    command: ["python", "-m", "app.execution_worker"]
    environment:
      CONTROL_PLANE_ENVIRONMENT: production
      CONTROL_PLANE_DB_HOST: postgres
      CONTROL_PLANE_DB_PORT: 5432
      CONTROL_PLANE_DB_NAME: ai_orchestra
      CONTROL_PLANE_DB_USER: ai_orchestra
      CONTROL_PLANE_DB_PASSWORD: ${CONTROL_PLANE_DB_PASSWORD}
      CONTROL_PLANE_SERVER_USERNAME: execution-worker
      CONTROL_PLANE_SERVER_PASSWORD: execution-worker-does-not-use-manager-auth
      CONTROL_PLANE_OPENCODE_INTERNAL_URL: http://opencode:4096
      CONTROL_PLANE_OPENCODE_USERNAME: ${OPENCODE_SERVER_USERNAME}
      CONTROL_PLANE_OPENCODE_PASSWORD: ${OPENCODE_SERVER_PASSWORD}
      CONTROL_PLANE_EXECUTION_TIMEOUT_SECONDS: ${CONTROL_PLANE_EXECUTION_TIMEOUT_SECONDS:-7200}
      CONTROL_PLANE_EXECUTION_WORKER_LEASE_SECONDS: ${CONTROL_PLANE_EXECUTION_WORKER_LEASE_SECONDS:-120}
      CONTROL_PLANE_EXECUTION_WORKER_MAX_ACTIVE: ${CONTROL_PLANE_EXECUTION_WORKER_MAX_ACTIVE:-4}
      CONTROL_PLANE_EXECUTION_WORKER_POLL_SECONDS: ${CONTROL_PLANE_EXECUTION_WORKER_POLL_SECONDS:-5}
      CONTROL_PLANE_EXECUTION_WORKER_HEALTH_PATH: /tmp/ai-orchestra-execution-worker.heartbeat
      CONTROL_PLANE_TASK_WORKSPACE_ROOT: /workspace/worktrees/managed
      CONTROL_PLANE_WORKSPACE_MANAGER_MAX_FILES: ${WORKSPACE_MANAGER_MAX_FILES:-100000}
    volumes:
      - task-workspaces:/workspace/worktrees/managed:ro
    networks:
      - control-db
      - model-net
    depends_on:
      postgres:
        condition: service_healthy
      opencode:
        condition: service_healthy
      workspace-manager:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 256m
    cpus: 0.35
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import os,time; p='/tmp/ai-orchestra-execution-worker.heartbeat'; assert os.path.isfile(p) and time.time()-os.path.getmtime(p) < 180"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: "5"

  repo-manager:
    build:
      context: ./control_plane
      target: repo-manager
    image: ai-development-department/repo-manager:0.9.0
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    command: ["python", "-m", "app.repository_manager"]
    env_file:
      - .env.repositories
    environment:
      CONTROL_PLANE_ENVIRONMENT: production
      CONTROL_PLANE_DB_HOST: postgres
      CONTROL_PLANE_DB_PORT: 5432
      CONTROL_PLANE_DB_NAME: ai_orchestra
      CONTROL_PLANE_DB_USER: ai_orchestra
      CONTROL_PLANE_DB_PASSWORD: ${CONTROL_PLANE_DB_PASSWORD}
      CONTROL_PLANE_SERVER_USERNAME: repo-manager
      CONTROL_PLANE_SERVER_PASSWORD: repo-manager-does-not-use-manager-auth
      CONTROL_PLANE_OPENCODE_PASSWORD: repo-manager-does-not-use-opencode-auth
      REPO_MANAGER_STORAGE_ROOT: /var/lib/ai-orchestra/repositories
      REPO_MANAGER_HEALTH_PATH: /tmp/ai-orchestra-repo-manager.heartbeat
      REPO_MANAGER_LEASE_SECONDS: ${REPO_MANAGER_LEASE_SECONDS:-300}
      REPO_MANAGER_GIT_TIMEOUT_SECONDS: ${REPO_MANAGER_GIT_TIMEOUT_SECONDS:-60}
      REPO_MANAGER_REFRESH_SECONDS: ${REPO_MANAGER_REFRESH_SECONDS:-3600}
      REPO_MANAGER_RETRY_BASE_SECONDS: ${REPO_MANAGER_RETRY_BASE_SECONDS:-30}
      REPO_MANAGER_RETRY_MAX_SECONDS: ${REPO_MANAGER_RETRY_MAX_SECONDS:-1800}
      REPO_MANAGER_MAX_ACTIVE: ${REPO_MANAGER_MAX_ACTIVE:-1}
      REPO_MANAGER_POLL_SECONDS: ${REPO_MANAGER_POLL_SECONDS:-10}
      REPO_MANAGER_MAX_REPOSITORY_BYTES: ${REPO_MANAGER_MAX_REPOSITORY_BYTES:-5368709120}
      REPO_MANAGER_MIN_FREE_BYTES: ${REPO_MANAGER_MIN_FREE_BYTES:-536870912}
    volumes:
      - repository-mirrors:/var/lib/ai-orchestra/repositories
    networks:
      - control-db
      - repository-egress
    depends_on:
      postgres:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 64
    mem_limit: 512m
    cpus: 0.50
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import os,time; p='/tmp/ai-orchestra-repo-manager.heartbeat'; assert os.path.isfile(p) and time.time()-os.path.getmtime(p) < 180"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: "5"

  workspace-manager:
    build:
      context: ./control_plane
      target: workspace-manager
    image: ai-development-department/workspace-manager:0.9.0
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    command: ["python", "-m", "app.workspace_manager"]
    environment:
      CONTROL_PLANE_ENVIRONMENT: production
      CONTROL_PLANE_DB_HOST: postgres
      CONTROL_PLANE_DB_PORT: 5432
      CONTROL_PLANE_DB_NAME: ai_orchestra
      CONTROL_PLANE_DB_USER: ai_orchestra
      CONTROL_PLANE_DB_PASSWORD: ${CONTROL_PLANE_DB_PASSWORD}
      CONTROL_PLANE_SERVER_USERNAME: workspace-manager
      CONTROL_PLANE_SERVER_PASSWORD: workspace-manager-does-not-use-manager-auth
      CONTROL_PLANE_OPENCODE_PASSWORD: workspace-manager-does-not-use-opencode-auth
      WORKSPACE_MANAGER_MIRROR_ROOT: /var/lib/ai-orchestra/repositories
      WORKSPACE_MANAGER_STORAGE_ROOT: /workspace/worktrees/managed
      WORKSPACE_MANAGER_HEALTH_PATH: /tmp/ai-orchestra-workspace-manager.heartbeat
      WORKSPACE_MANAGER_LEASE_SECONDS: ${WORKSPACE_MANAGER_LEASE_SECONDS:-180}
      WORKSPACE_MANAGER_GIT_TIMEOUT_SECONDS: ${WORKSPACE_MANAGER_GIT_TIMEOUT_SECONDS:-60}
      WORKSPACE_MANAGER_RETRY_BASE_SECONDS: ${WORKSPACE_MANAGER_RETRY_BASE_SECONDS:-15}
      WORKSPACE_MANAGER_RETRY_MAX_SECONDS: ${WORKSPACE_MANAGER_RETRY_MAX_SECONDS:-900}
      WORKSPACE_MANAGER_MAX_PREPARE_FAILURES: ${WORKSPACE_MANAGER_MAX_PREPARE_FAILURES:-8}
      WORKSPACE_MANAGER_MAX_ACTIVE: ${WORKSPACE_MANAGER_MAX_ACTIVE:-1}
      WORKSPACE_MANAGER_POLL_SECONDS: ${WORKSPACE_MANAGER_POLL_SECONDS:-5}
      WORKSPACE_MANAGER_MAX_FILES: ${WORKSPACE_MANAGER_MAX_FILES:-100000}
      WORKSPACE_MANAGER_MAX_FILE_BYTES: ${WORKSPACE_MANAGER_MAX_FILE_BYTES:-134217728}
      WORKSPACE_MANAGER_MAX_WORKSPACE_BYTES: ${WORKSPACE_MANAGER_MAX_WORKSPACE_BYTES:-5368709120}
      WORKSPACE_MANAGER_MIN_FREE_BYTES: ${WORKSPACE_MANAGER_MIN_FREE_BYTES:-536870912}
    volumes:
      - repository-mirrors:/var/lib/ai-orchestra/repositories:ro
      - task-workspaces:/workspace/worktrees/managed
    networks:
      - control-db
    depends_on:
      postgres:
        condition: service_healthy
      workspace-volume-init:
        condition: service_completed_successfully
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 96
    mem_limit: 512m
    cpus: 0.50
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import os,time; p='/tmp/ai-orchestra-workspace-manager.heartbeat'; assert os.path.isfile(p) and time.time()-os.path.getmtime(p) < 180"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: "5"

  workspace-volume-init:
    build:
      context: ./control_plane
      target: workspace-manager
    image: ai-development-department/workspace-manager:0.9.0
    user: "0:0"
    read_only: true
    network_mode: none
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - chown 10001:10001 /workspace/worktrees/managed && chmod 0700 /workspace/worktrees/managed
    volumes:
      - task-workspaces:/workspace/worktrees/managed
    restart: "no"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - FOWNER
    mem_limit: 32m
    cpus: 0.10
    pids_limit: 16
    logging:
      driver: json-file
      options:
        max-size: 1m
        max-file: "1"

  model-router:
    build:
      context: ./model_router
      args:
        LITELLM_VERSION: ${LITELLM_VERSION:-1.98.0}
    image: ai-development-department/model-router:${LITELLM_VERSION:-1.98.0}
    restart: unless-stopped
    init: true
    env_file:
      - .env.providers
    environment:
      MODEL_ROUTER_MASTER_KEY: ${MODEL_ROUTER_MASTER_KEY}
    volumes:
      - ./runtime/model-router.yaml:/app/config.yaml:ro
    networks:
      - router-backend
      - provider-egress
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 768m
    cpus: 1.00
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4000/health/liveliness', timeout=3)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: "5"

  model-gateway:
    build:
      context: ./model_gateway
    image: ai-development-department/model-gateway:0.1.0
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /etc/nginx/conf.d:size=1m,mode=1777
      - /var/cache/nginx:size=16m,mode=1777
      - /var/run:size=4m,mode=1777
    environment:
      MODEL_ROUTER_MASTER_KEY: ${MODEL_ROUTER_MASTER_KEY}
      MODEL_ROUTER_CLIENT_KEY: ${MODEL_ROUTER_CLIENT_KEY}
    ports:
      - "127.0.0.1:${MODEL_GATEWAY_PORT:-18089}:8080"
    networks:
      - model-net
      - router-backend
    depends_on:
      model-router:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - NET_RAW
    mem_limit: 64m
    cpus: 0.25
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  opencode:
    build:
      context: .
      args:
        OPENCODE_VERSION: ${OPENCODE_VERSION:-1.18.27}
    image: ai-development-department/opencode:${OPENCODE_VERSION:-1.18.27}-toolchain1
    restart: unless-stopped
    init: true
    environment:
      OPENCODE_CONFIG: /root/.config/opencode/opencode.json
      OPENCODE_SERVER_USERNAME: ${OPENCODE_SERVER_USERNAME}
      OPENCODE_SERVER_PASSWORD: ${OPENCODE_SERVER_PASSWORD}
      MODEL_ROUTER_CLIENT_KEY: ${MODEL_ROUTER_CLIENT_KEY}
      GIT_AUTHOR_NAME: ${GIT_AUTHOR_NAME:-AI Development Department}
      GIT_AUTHOR_EMAIL: ${GIT_AUTHOR_EMAIL:-ai-department@local}
      GIT_COMMITTER_NAME: ${GIT_COMMITTER_NAME:-AI Development Department}
      GIT_COMMITTER_EMAIL: ${GIT_COMMITTER_EMAIL:-ai-department@local}
    command:
      - opencode
      - web
      - --hostname
      - 0.0.0.0
      - --port
      - "4096"
    ports:
      - "127.0.0.1:${OPENCODE_PORT:-4096}:4096"
    networks:
      - model-net
    volumes:
      - ./runtime/opencode.json:/root/.config/opencode/opencode.json:ro
      - ./prompts:/root/.config/opencode/prompts:ro
      - ./policy/AGENTS.md:/workspace/repos/AGENTS.md:ro
      - ./policy/AGENTS.md:/workspace/worktrees/AGENTS.md:ro
      - ./repos:/workspace/repos/projects
      - ./worktrees:/workspace/worktrees
      - task-workspaces:/workspace/worktrees/managed
      - ./data/opencode:/root/.local/share/opencode
      - ./data/state:/root/.local/state/opencode
    depends_on:
      model-gateway:
        condition: service_healthy
      workspace-volume-init:
        condition: service_completed_successfully
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 2g
    cpus: 2.00
    healthcheck:
      test:
        - CMD-SHELL
        - "curl -fsS -u \"$${OPENCODE_SERVER_USERNAME}:$${OPENCODE_SERVER_PASSWORD}\" http://127.0.0.1:4096/global/health >/dev/null || exit 1"
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: "5"

networks:
  control-db:
    internal: true
  control-access:
  model-net:
  router-backend:
    internal: true
  provider-egress:
  repository-egress:

volumes:
  control-plane-postgres:
  repository-mirrors:
  task-workspaces:
